<!-- Two soft neon blooms behind everything. Decoration, one layer, inert. -->
<div class="ambient" aria-hidden="true"></div>

<!-- == CHROME: context left, actions right (spec 29). No hamburger. ====== -->
<header class="chrome topbar">
  <nav class="crumbs" aria-label="Location">
    <button class="crumb" id="crumb-home">Binders</button>
    <span class="crumb-sep" id="crumb-sep" hidden>/</span>
    <button class="crumb crumb-current" id="crumb-binder" hidden title="Rename this Binder"></button>
  </nav>
  <div class="actions">
    <!-- The bell only exists when there is something to say (spec 18). -->
    <button class="icon-btn" id="bell" hidden aria-label="Notifications">&#9679;</button>
    <button class="icon-btn" id="search-btn" aria-label="Search or ask (Command K)">&#9906;</button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#8942;</button>
      <div class="menu" id="menu" hidden role="menu"></div>
    </div>
  </div>
</header>

<!-- Notifications are a bar across the page, not a popover: when there is
     something to say it gets the full width, and when there is nothing the
     bar does not exist (spec 18). -->
<div class="panel" id="notifs" hidden role="region" aria-label="Notifications"></div>

<!-- == TAG RAIL: the horizontal dimension of a Binder (spec 8/9/10) ====== -->
<nav class="chrome tagrail" id="tagrail" hidden aria-label="Tags"></nav>

<!-- == STAGE: the text, centred. Everything else is chrome. ============== -->
<main class="stage" id="stage" tabindex="-1"></main>

<!-- == OVERLAYS ========================================================== -->

<!-- Find, ask and speak on one surface (spec 12/13/14). -->
<div class="overlay" id="palette" hidden role="dialog" aria-modal="true" aria-label="Search or ask">
  <div class="term">
    <div class="term-bar">
      <span id="term-scope">All Binders</span>
      <span class="term-mode" id="term-mode">Find</span>
    </div>
    <!-- Results sit above the field, and the panel is anchored to the foot of
         the window, so what you are typing never moves under your hands. -->
    <div class="results" id="results"></div>
    <div class="term-input-row">
      <span class="term-caret" aria-hidden="true">&#8250;</span>
      <input class="term-input" id="term-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Find a sheet, or ask a question">
      <button class="mic" id="mic" aria-label="Speak">Mic</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<!-- == THE SAMPLE BINDER ================================================
     "What's Binders?" is landing page, demo, documentation and onboarding at
     once (spec 27), and it is a real Binder the user can edit or delete. It
     lives here as text rather than as a string inside scripts.js, because a
     document should be stored as a document. Seeded on first run only.  -->
<script type="text/markdown" id="sample-binder" data-title="What&#39;s Binders?">
Everything on this screen is one text document. The titles below are lines
that begin with a `#`. Nothing else is happening.

Walk down with the arrow keys. Open one with Enter, and you are already
writing in it.

# Start here #start

You are reading a Binder: a single text document that knows how to be
navigated.

There was no landing page, no signup and no tour, because there is nothing to
set up. Open Binders and you are already using it.

Every sheet here is editable as it stands, including this one. Change this
sentence if you like — it is saved on this device as you type.

When you are done reading, delete this Binder and write your own. That is the
whole first run: **open, read, change it, delete, write.**

# Sheets are just headings #start

Open a sheet and you are already writing in it. There is no edit button and no
edit mode, because the page you are reading is the page you type into.

Underneath, this whole Binder is one text file. No sheet objects, no fields,
no database. Only this:

```
# Authentication

Use magic links for authentication.

# Pricing

Pro should cost R$25/month.
```

A line starting with `#` begins a new sheet. Collapsed, the sheets are an
index. Open, a sheet is a page. Same text, two representations.

Each heading is also its own web address. **Copy sheet link**, in the menu
while a sheet is open, gives you a URL that opens right back here.

# Write a new sheet #start

Inside a sheet, type `#` and a space at the start of any empty line. The line
becomes a heading as you type it, and **Enter** turns it into a sheet of its
own — with its own row in the index and its own address.

From the index, the space above the first sheet and below the last one is
writable too — start a line there with `#` the same way, or press **S** for
a blank one after wherever you were reading. Either way the new sheet
arrives with the caret in its name.

The same shorthand writes the rest as you go:

- `-` and a space starts a list
- `- [ ]` and a space starts a checkbox
- `>` and a space starts a quote
- `###` and a space is a heading inside the sheet
- `**bold**`, `*italic*`, `~~struck~~` and `code` format as you close them

The markers are never left lying in the text. **Backspace** at the start of a
line takes its marker back off.

**Esc** puts the sheet back in the index, and **up** and **down** carry the
caret from one sheet to the next.

# Tags are the columns #start

A sheet has one tag, written on its title line, and you can see it on the
right of every title. One tag, so a sheet is in exactly one place.

From the index, press the **left and right arrows** to move between them. The
rail at the top is the whole Kanban feature: each tag is a column, and every
sheet in it is still ordinary text.

To retag this sheet, click its tag and pick another, or type one that does
not exist yet into the field at the foot of that popover. The **×** beside a
tag in the same popover takes it off every sheet that has it. No Markdown to
remember, and the column follows the sheet you just moved.

# Search, and asking your own text #start

Press **Cmd K**.

Type a few letters to jump to any sheet, in any Binder. Or press **Tab** and
ask a question instead:

> What did we decide about sync pricing?

The answer is built from the sheets you already wrote, on this device, and it
points you at them. AI here is a way to navigate your own information, not
another place for information to live.

The same field takes your voice. Press **Mic** and try:

> Add a sheet about the new pricing. We decided on R$25 for Pro.

# Quotes instead of comments #text

There is no comment system, and nothing to open. Start a line with `>` to
quote something, and answer it on the line below with an em dash:

> The lightness of a text file, with better ways to navigate it.
— This is the whole product in one line. @Felipe (Felipe)

A discussion is a few lines of text, in the sheet it is about, saved with it.

Mentions are just text too. @Felipe should review this sheet before we ship.
When someone is mentioned, a dot appears at the top right, and only then.

# Reminders #text

A reminder is a line with a time in it. Nothing else, no task system — start
the line with `!` and leave it there, because the time is part of what the
line says:

! tomorrow 09:00 Call Joao about the proposal

Binders installs as an app, so the notification arrives at the time you wrote.
Everything below is a checklist, which is also just text:

- [x] Write the spec
- [ ] Draft the pricing page
- [ ] Ask @Felipe to read it

Click a box. It edits the document, because the document is the state.

# Save it, print it, email it #text

Press **Cmd S**. You get one self-contained HTML file: your Binder, offline,
openable by anyone, with the original text still inside it so it can come
back in later.

Press **Cmd P** to print, or print a single sheet from its own footer. Save as
PDF from there if you want one.

That file is the artifact. Write a Binder, save it, attach it to an email.
The person who opens it needs no account and no Binders.

# Draft the pricing page #doing

Free is the file: the full experience, offline, on one device, yours to keep.

Pro is sync, at $10/month or R$25/month in Brazil.

Team is collaboration: shared Binders, mentions, quotes, notifications.

- [x] Agree the three tiers
- [ ] Write the Pro page
- [ ] Decide what the free tier never loses

# Decide on sync pricing #done

We decided sync is the thing people pay for, at $10 a month, and R$25 in
Brazil so that adopting it there is genuinely easy.

The free client is never crippled to push the upgrade. It keeps working
offline, forever, with no account.

# Everything is text #done

Notes, documents, knowledge, specs, tasks, a light workflow, a Kanban. One
primitive underneath all of it, and one screen on top of it: there is no read
mode and no edit mode, because the document you read is the document you
write.

If plain text is easier, Binders uses plain text. It only exists where it
makes working with that text better.

Now delete this Binder from the menu at the top right, and write something.
</script>

<script src="scripts.js"></script>
</body>
